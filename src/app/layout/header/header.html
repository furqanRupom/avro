   <header class="sticky top-0 z-50 border-b border-gray-200 bg-white">
     <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6">

       <!-- Brand -->
       <a
         routerLink="/"
         class="text-4xl font-bold tracking-tight text-[var(--mat-sys-primary)]"
       >
         Avro<span class="text-gray-900">.</span>
       </a>

       <!-- Desktop Navigation -->
       <nav class="hidden items-center gap-8 md:flex">
         <a
           routerLink="/"
           routerLinkActive="font-semibold text-[var(--mat-sys-primary)]"
           [routerLinkActiveOptions]="{ exact: true }"
           class="text-xl text-gray-600 transition hover:text-[var(--mat-sys-primary)]"
         >
           Home
         </a>

         <a
           routerLink="/products"
           routerLinkActive="font-semibold text-[var(--mat-sys-primary)]"
           class="text-xl text-gray-600 transition hover:text-[var(--mat-sys-primary)]"
         >
           Products
         </a>

         <a
           routerLink="/categories"
           routerLinkActive="font-semibold text-[var(--mat-sys-primary)]"
           class="text-xl text-gray-600 transition hover:text-[var(--mat-sys-primary)]"
         >
           Categories
         </a>

         <a
           routerLink="/about"
           routerLinkActive="font-semibold text-[var(--mat-sys-primary)]"
           class="text-xl text-gray-600 transition hover:text-[var(--mat-sys-primary)]"
         >
           About Us
         </a>
       </nav>

       <!-- Actions -->
       <div class="flex items-center gap-3">

         <a
           routerLink="/wishlist"
           aria-label="Wishlist"
           class="flex size-10 items-center justify-center rounded-full text-gray-600 transition hover:bg-gray-100 hover:text-[var(--mat-sys-primary)]"
         >
           <mat-icon>favorite_border</mat-icon>
         </a>

         <a
           routerLink="/cart"
           aria-label="Shopping cart"
           class="flex size-10 items-center justify-center rounded-full text-gray-600 transition hover:bg-gray-100 hover:text-[var(--mat-sys-primary)]"
         >
           <mat-icon>shopping_cart</mat-icon>
         </a>

         <a
           routerLink="/auth/login"
           class="hidden items-center gap-2 rounded-lg bg-[var(--mat-sys-primary)] px-4 py-2 text-xl font-medium text-white transition hover:opacity-90 sm:flex"
         >
           <mat-icon class="!text-[20px]">person_outline</mat-icon>
           Sign In
         </a>

       </div>
     </div>
   </header>
