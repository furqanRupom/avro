<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{ user()!.name }}</mat-card-title>
    <mat-card-subtitle>{{ user()!.role }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <p>{{ user()!.email }}</p>
  </mat-card-content>

  <mat-card-actions align="end">
    <button
      mat-button
      [disabled]="IsLoggingOut()"
      (click)="logout()"
    >
      @if (IsLoggingOut()) {
        <mat-spinner diameter="18"></mat-spinner>
      } @else {
        Logout
      }
    </button>
  </mat-card-actions>
</mat-card>
