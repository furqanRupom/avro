<p class="text-4xl text-center p-3 max-w-7xl bg-gray-50 mx-auto rounded-3xl font-bold text-pink-600">Avro<span class="text-purple-600">.</span></p>

<p class="text-xl font-thin text-center">{{msg}}</p>
<div class="flex justify-center items-center py-3">
  <button [disabled]="isDisabled" (click)="onClick()" class="px-7 py-3 bg-pink-600 text-lg mx-auto text-center cursor-pointer rounded-3xl font-semibold text-white hover:scroll-50 transition-all ease-in-out">20% Disc. Get Now</button>
</div>


<p class="text-xl font-thin text-center pt-4">Total Discount you Want</p>
<div class="flex justify-center space-x-5 items-center pt-12">
  <button class="w-fit px-5 py-2 bg-pink-500 font-bold text-2xl rounded-3xl cursor-pointer" (click)="onIncrement()">+</button>
  <p class="border border-pink-500 rounded-3xl p-2 text-xl">{{count()}}% disc</p>
  <button class="w-fit px-5 py-2 bg-purple-500 font-bold text-2xl rounded-3xl cursor-pointer" (click)="onDecrement()">-</button>
  <button class="w-fit px-5 py-2 bg-rose-500 font-bold text-2xl rounded-3xl cursor-pointer" (click)="onReset()">Reset</button>
</div>
